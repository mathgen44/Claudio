[package]
name = "claudio-desktop"
description = "Claudio, assistant personnel local-first"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
claudio-app = { version = "0.1.0", path = "../../../crates/claudio-app" }
anyhow = "1.0.104"
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["rt"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

