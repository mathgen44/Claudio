[package]
name = "claudio-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
claudio-core = { version = "0.1.0", path = "../claudio-core" }
claudio-docs = { version = "0.1.0", path = "../claudio-docs" }
claudio-perms = { version = "0.1.0", path = "../claudio-perms" }
futures-util = "0.3.34"
globset = "0.4.20"
html2text = "0.17.4"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "process", "io-util", "sync", "fs", "net"] }
tracing = "0.1.44"
trash = "5.2.9"
url = "2.5.8"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
