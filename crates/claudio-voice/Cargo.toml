[package]
name = "claudio-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
claudio-hw = { version = "0.1.0", path = "../claudio-hw" }
claudio-llm = { version = "0.1.0", path = "../claudio-llm" }
claudio-models = { version = "0.1.0", path = "../claudio-models" }
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "sync", "rt", "macros", "time", "fs", "io-util"] }
tracing = "0.1.44"
zip = "9.1.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
