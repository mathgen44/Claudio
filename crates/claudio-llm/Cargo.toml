[package]
name = "claudio-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
claudio-core = { version = "0.1.0", path = "../claudio-core" }
claudio-hw = { version = "0.1.0", path = "../claudio-hw" }
claudio-models = { version = "0.1.0", path = "../claudio-models" }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "sync", "rt", "macros", "time", "fs"] }
tracing = "0.1.44"
windows = { version = "0.62.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
zip = "9.1.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
