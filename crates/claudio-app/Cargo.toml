[package]
name = "claudio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
claudio-core = { version = "0.1.0", path = "../claudio-core" }
claudio-hw = { version = "0.1.0", path = "../claudio-hw" }
claudio-llm = { version = "0.1.0", path = "../claudio-llm" }
claudio-models = { version = "0.1.0", path = "../claudio-models" }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
